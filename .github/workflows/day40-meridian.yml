name: Day 40 Meridian capstone
on:
  push:
    branches: [main]
    paths: ['day-40-framework-and-capstone/**', '.github/workflows/day40-meridian.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: day-40-framework-and-capstone
    env:
      MERIDIAN_EMAIL: ${{ secrets.MERIDIAN_EMAIL }}
      MERIDIAN_PASSWORD: ${{ secrets.MERIDIAN_PASSWORD }}
      MERIDIAN_POLICY_NUMBER: ${{ secrets.MERIDIAN_POLICY_NUMBER }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: day-40-framework-and-capstone/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Meridian capstone tests
        run: npm test
      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npm run report:generate
      - name: Save reports and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: day40-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            day-40-framework-and-capstone/allure-results/
            day-40-framework-and-capstone/allure-report/
            day-40-framework-and-capstone/playwright-report/
            day-40-framework-and-capstone/test-results/
          retention-days: 7
