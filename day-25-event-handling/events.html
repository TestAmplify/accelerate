<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day 25 · Event Handling Practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <p class="lesson-label">Accelerate · Week 5 / Day 25</p>
    <h1>Event Handling for Automation</h1>

    <button id="click-box" class="event-box" type="button">Click me! (Practice requirement)</button>
    <div id="hover-box" class="event-box">Hover over me! (Practice requirement)</div>

    <button id="reset-btn" type="button">Reset Events</button>
    <button id="simulate-btn" type="button">Simulate Automation</button>

    <h2>Event log</h2>
    <div id="event-log" role="log" aria-live="polite" aria-label="Event log"></div>
    <p class="hint">Try clicking and moving your mouse into and out of the hover
      box. Reset before trying Simulate Automation.</p>
  </main>
  <script src="day25-events.js"></script>
</body>
</html>
